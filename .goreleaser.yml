version: 2

project_name: envirou

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: .
    binary: envirou
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/sverrirab/envirou/cmd.Version={{.Version}}
    overrides:
      - goos: windows
        ldflags:
          - -s -w -X github.com/sverrirab/envirou/cmd.Version={{.Version}} -H windowsconsole
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: "false"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - repository:
      owner: sverrirab
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/sverrirab/envirou
    description: View and manage your shell environment variables
    license: MIT
    install: |
      bin.install "envirou"
    test: |
      system "#{bin}/envirou", "version"

scoops:
  - repository:
      owner: sverrirab
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/sverrirab/envirou
    description: View and manage your shell environment variables
    license: MIT

chocolateys:
  - name: envirou
    owners: sverrirab
    title: Envirou
    authors: Sverrir A. Berg
    project_url: https://github.com/sverrirab/envirou
    project_source_url: https://github.com/sverrirab/envirou
    docs_url: https://github.com/sverrirab/envirou
    bug_tracker_url: https://github.com/sverrirab/envirou/issues
    license_url: https://github.com/sverrirab/envirou/blob/main/LICENSE
    require_license_acceptance: false
    tags: "environment variables cli terminal shell"
    summary: View and manage your shell environment variables
    description: |
      Envirou (ev) helps you view and manage your shell environment variables
      with nice formatting and customizable grouping. Quickly switch between
      environment profiles, inspect PATH variables, load .env files, and more.
    release_notes: "https://github.com/sverrirab/envirou/releases/tag/{{ .Tag }}"
    api_key: "{{ .Env.CHOCOLATEY_API_KEY }}"
    source_repo: "https://push.chocolatey.org/"
